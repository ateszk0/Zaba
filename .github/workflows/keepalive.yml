name: Keep the demo database awake

# A free Supabase project is paused after a week without activity. This asks it for
# the menu every day, which counts as activity. It does nothing until the
# repository variable DEMO_SUPABASE_URL is set (and the secret DEMO_SUPABASE_KEY:
# the public key the app ships with), so it is harmless before the demo exists.
#
# GitHub switches scheduled workflows off after 60 days without repository activity,
# but its documentation says so for public repositories only; this one is private.
# If the repository ever becomes public, check the Actions tab once in a while, or
# run this workflow by hand before a presentation.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Ask for the menu
    runs-on: ubuntu-latest
    if: vars.DEMO_SUPABASE_URL != ''
    steps:
      - name: GET the menu
        env:
          SUPABASE_URL: ${{ vars.DEMO_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.DEMO_SUPABASE_KEY }}
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            "$SUPABASE_URL/rest/v1/catalog_products?select=id&limit=1" -H "apikey: $SUPABASE_KEY")"
          echo "The backend answered HTTP $code"
          [ "$code" = "200" ]
