name: Deploy the demo web apps

# Builds the customer app and/or the admin page for the demo environment and
# uploads them to Cloudflare. Started by hand (Actions > Deploy the demo web apps >
# Run workflow): a link a customer opens should change when somebody decides so, not
# on every push. The APK is not part of this: build and deploy it from a machine
# that has the signing key (deploy/demo/deploy-web.sh apk).
#
# Needs, in the repository settings:
#   variables: DEMO_SUPABASE_URL, DEMO_EMAIL
#   secrets:   DEMO_SUPABASE_KEY (the public key the app ships with), DEMO_PASSWORD,
#              CLOUDFLARE_API_TOKEN (permission: Workers Scripts edit), CLOUDFLARE_ACCOUNT_ID
# docs/demo-environment.md explains where each one comes from.

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options: [both, app, admin]
        default: both

permissions:
  contents: read

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      # The Cloudflare deploy tool, pinned in package.json.
      - run: npm ci

      # The build configuration holds public values only. The admin page's demo
      # button (ADMIN_DEMO_*) is deliberately not in it: a password in a public page.
      - name: Write config/demo.json
        env:
          SUPABASE_URL: ${{ vars.DEMO_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.DEMO_SUPABASE_KEY }}
          DEMO_EMAIL: ${{ vars.DEMO_EMAIL }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          config = {
              "APP_ENV": "demo",
              "SUPABASE_URL": os.environ["SUPABASE_URL"],
              "SUPABASE_ANON_KEY": os.environ["SUPABASE_KEY"],
          }
          if os.environ.get("DEMO_EMAIL") and os.environ.get("DEMO_PASSWORD"):
              config["DEMO_EMAIL"] = os.environ["DEMO_EMAIL"]
              config["DEMO_PASSWORD"] = os.environ["DEMO_PASSWORD"]
          missing = [k for k in ("SUPABASE_URL", "SUPABASE_ANON_KEY") if not config[k]]
          if missing:
              sys.exit(f"Repository settings missing: {', '.join(missing)} (see the comment at the top of this workflow)")
          json.dump(config, open("config/demo.json", "w"))
          PY

      - name: Deploy the customer app
        if: inputs.target != 'admin'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: deploy/demo/deploy-web.sh app

      - name: Deploy the admin page
        if: inputs.target != 'app'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: deploy/demo/deploy-web.sh admin
