name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Flutter app (format, analyze, test, build web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --dart-define=APP_ENV=dev
      # The admin page is a separate build of the same project.
      - run: flutter build web --release -t lib/main_admin.dart --dart-define=APP_ENV=dev --output build/admin

  database:
    name: Database (migrations, pgTAP tests, API smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      # The Supabase CLI is pinned in package.json.
      - run: npm ci

      # The payment provider's signing secret for the local stack's Edge
      # Functions: random, for this run only (the CLI reads supabase/.env).
      - run: echo "FAKE_PAYMENT_WEBHOOK_SECRET=$(openssl rand -hex 32)" > supabase/.env

      # The shared payment code (signing, sessions, webhook verification).
      - run: npm run test:functions

      # Local stack without the parts the tests do not need.
      - run: npx supabase start -x studio,imgproxy,vector,logflare,mailpit

      # Applies every migration and the seed data to a fresh database.
      - run: npx supabase db reset
      - run: npx supabase test db
      - run: npx supabase db lint --schema public,private --fail-on error
      - run: python3 supabase/tests/api_smoke.py --from-local
      - run: python3 -m pip install --quiet websockets==17.3
      - run: python3 supabase/tests/realtime_smoke.py --from-local

      # The payment path through the real Edge Functions.
      - run: python3 supabase/tests/payment_smoke.py --from-local

      # Twice: the second run must find the account and leave it alone.
      - run: python3 tool/create_demo_user.py --from-local
      - run: python3 tool/create_demo_user.py --from-local

      # The staff accounts of the admin page (again twice for the first).
      - run: python3 tool/create_staff_user.py --from-local --role operator
      - run: python3 tool/create_staff_user.py --from-local --role operator
      - run: python3 tool/create_staff_user.py --from-local --role admin

      # The app's own sign-in code against the real auth server.
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: App integration tests (auth, menu, cart, orders, payment, admin)
        working-directory: app
        run: |
          flutter pub get
          # The legacy anon JWT, as on the self-hosted staging.
          stack_status="$(npx supabase status -o json)"
          key="$(python3 -c 'import json, sys; t = sys.argv[1]; print(json.loads(t[t.index("{"):])["ANON_KEY"])' "$stack_status")"
          secret="$(python3 -c 'import json, sys; t = sys.argv[1]; print(json.loads(t[t.index("{"):])["SECRET_KEY"])' "$stack_status")"
          flutter test test/integration \
            --dart-define=ZABA_TEST_SUPABASE_URL=http://127.0.0.1:54321 \
            --dart-define=ZABA_TEST_SUPABASE_KEY="$key" \
            --dart-define=ZABA_TEST_SUPABASE_SECRET_KEY="$secret"

      - if: always()
        run: npx supabase stop --no-backup

  deploy-files:
    name: Deployment files (shell scripts, Caddyfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - run: shellcheck -x -S warning deploy/selfhost/*.sh

      # The same image and version the server runs.
      - name: Validate the Caddyfile
        run: >
          docker run --rm
          -e ZABA_APP_HOST=app.example.org -e ZABA_API_HOST=api.example.org -e ZABA_ADMIN_HOST=admin.example.org
          -v "$PWD/deploy/selfhost/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.11.7 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # Run the binary from its container instead of the gitleaks GitHub Action,
      # which needs a licence key once the repository moves to an organisation.
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose
