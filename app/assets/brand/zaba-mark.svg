<svg xmlns="http://www.w3.org/2000/svg" viewBox="436 456 682 738" role="img" aria-labelledby="zaba-title">
  <title id="zaba-title">Zaba</title>
  <!--
    The Zaba mark: a rounded Z with a delivery scooter riding along its foot, and four speed
    lines cut into its diagonal. One filled shape in one colour, so it can be recoloured
    (white on green for the app icon, green on cream inside the app) and it stays sharp from
    16 px to a poster.

    The design comes from the picture the owner supplied. This file is a hand redrawing of it
    from measurements, not an automatic trace: the Z is a single 152-unit stroke with round
    ends (top bar, diagonal, bottom bar), the speed lines are slots in the diagonal's right
    edge, and the scooter is one outline plus two equal round wheels whose tops the body covers. Coordinates are those of the 1536 px
    picture. This file is the source: tool/brand/make_icons.py draws every icon from it.

    The path winds clockwise for what is filled (Z, scooter, wheels) and counter-clockwise for
    the holes (the wheel hubs), with the default nonzero fill rule.
  -->
